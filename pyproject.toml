[project]
name = "bookly-support-agent"
version = "0.1.0"
description = "AI-powered customer support agent for Bookly, a fictional online bookstore"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "langgraph>=0.3.3",
    "langchain-openai>=0.3.3",
    "langchain-core>=0.3.3",
    "streamlit>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookly"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
]
